version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: janconnect_db
    environment:
      POSTGRES_USER: janconnect
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: janconnect
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U janconnect -d janconnect"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - janconnect_net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: janconnect_backend
    environment:
      DATABASE_URL: "postgresql://janconnect:secret@db:5432/janconnect?schema=public"
      JWT_ACCESS_SECRET: "dev-access-secret-key-change-in-prod"
      JWT_REFRESH_SECRET: "dev-refresh-secret-key-change-in-prod"
      PORT: 8000
      FRONTEND_URL: "http://localhost:3000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy &&
             npx tsx scripts/seed.ts &&
             node dist/main.js"
    networks:
      - janconnect_net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "http://localhost:8000/api/v1"
    container_name: janconnect_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - janconnect_net

volumes:
  postgres_data:

networks:
  janconnect_net:
    driver: bridge
