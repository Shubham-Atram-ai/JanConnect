version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: janconnect
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: janconnect
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U janconnect -d janconnect"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
